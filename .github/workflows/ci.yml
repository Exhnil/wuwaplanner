name: CI
on:
    pull_request:
        branches:
            - master
            - develop

jobs:
    integrate:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint
            
            - name: Build
              run: npm run build