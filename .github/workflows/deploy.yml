name: Deploy

on:
    push:
        branches:
            - feat/github-action-config

jobs:
    deploy:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Deploy
              run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_wuwaplanner
                chmod 600 ~/.ssh/github_wuwaplanner

                ssh \
                    -i ~/.ssh/github_wuwaplanner \
                    -o StrictHostKeyChecking=no \
                    ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                    "echo 'Connected to server:' && hostname && echo 'User:' && whoami"